<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gaby Bracinho</title>
<meta name="description" content="Meus links">
<meta name="theme-color" content="#101010">
<meta property="og:title" content="Nome da Modelo">
<meta property="og:image" content="/avatar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Libre+Caslon+Text:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #101010; }
  body {
    min-height: 100vh;
    font-family: "Libre Caslon Text", Georgia, "Times New Roman", serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    background-image:
      linear-gradient(rgba(0, 0, 0, .25), rgba(0, 0, 0, .25)),
      linear-gradient(#101010, #fda1ff);
    background-repeat: no-repeat;
    background-size: 100% 100%;
    background-attachment: fixed;
  }

  .wrap {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: calc(40px + env(safe-area-inset-top, 0px)) 20px calc(100px + env(safe-area-inset-bottom, 0px));
  }

  [hidden] { display: none !important; }

  /* TOPO */
  header { text-align: center; margin-bottom: 16px; }
  .avatar {
    width: 96px; height: 96px;
    border-radius: 50%;
    border: 2px solid #fff;
    overflow: hidden;
    margin: 0 auto;
    background: linear-gradient(135deg, #e7a07a, #b4654a);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 {
    margin-top: 16px;
    padding: 0 20px;
    font-family: "Archivo Black", Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(30px, 10vw, 48px);
    line-height: 1.1;
    overflow-wrap: anywhere;
    text-shadow: 0 .5px 1px rgba(0, 0, 0, .25);
  }
  .bio {
    margin-top: 8px;
    padding: 0 40px;
    font-size: 16px;
    line-height: 1.4;
    text-shadow: 0 .5px 1px rgba(0, 0, 0, .25);
  }

  /* BOTÕES */
  .links { display: flex; flex-direction: column; gap: 16px; margin-top: 24px; }
  .btn {
    display: flex; align-items: center;
    width: 100%;
    min-height: 65px;
    padding: 8px;
    background: #fff;
    color: #000;
    border-radius: 8px;
    text-decoration: none;
    font-size: 15px;
    line-height: 1.35;
    text-align: center;
    white-space: pre-wrap;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { box-shadow: 0 4px 16px rgba(0, 0, 0, .2); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .btn .side { flex: none; width: 56px; display: flex; align-items: center; justify-content: center; }
  .btn .side img { width: 45px; height: 45px; object-fit: cover; border-radius: 8px; display: block; }
  .btn .txt { flex: 1; min-width: 0; padding: 0 4px; }
  .btn.sem-icone { padding-left: 40px; padding-right: 40px; justify-content: center; }
  .btn.sem-icone .txt { flex: none; }


  /* BOTÃO COM BANDEIRAS */
  .btn.col { flex-direction: column; justify-content: center; gap: 6px; padding: 10px 8px; }
  .btn.col .txt { flex: none; padding: 0; }
  .bandeiras { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .bandeiras svg { width: 36px; height: 24px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .15); display: block; }

  /* ANIMAÇÕES (pulsa / balança) */
  .pulse { animation: pulsar 1.6s ease-in-out infinite; }
  .wobble { animation: balancar 2.4s ease-in-out infinite; }
  @keyframes pulsar { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
  @keyframes balancar {
    0%, 60%, 100% { transform: rotate(0); }
    68% { transform: rotate(-1.4deg); }
    76% { transform: rotate(1.4deg); }
    84% { transform: rotate(-1deg); }
    92% { transform: rotate(1deg); }
  }

  /* TELA +18 */
  .idade {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background-image: linear-gradient(rgba(0, 0, 0, .25), rgba(0, 0, 0, .25)), linear-gradient(#101010, #fda1ff);
  }
  .idade .caixa {
    width: 100%; max-width: 380px;
    background: #fff; color: #000;
    border-radius: 8px;
    padding: 32px 24px 24px;
    text-align: center;
    box-shadow: 0 8px 40px rgba(0, 0, 0, .35);
  }
  .idade .selo { font-size: 44px; line-height: 1; margin-bottom: 14px; }
  .idade h2 { font-family: "Archivo Black", Impact, sans-serif; font-weight: 400; font-size: 22px; line-height: 1.2; margin-bottom: 10px; }
  .idade p { font-size: 15px; line-height: 1.5; color: #333; margin-bottom: 24px; }
  .idade button {
    display: block; width: 100%;
    font: inherit; font-size: 15px;
    padding: 14px 16px;
    border-radius: 8px;
    cursor: pointer;
  }
  .idade .sim { background: #000; color: #fff; border: 2px solid #000; font-weight: 700; margin-bottom: 10px; }
  .idade .nao { background: transparent; color: #000; border: 2px solid #ccc; }
  .idade button:focus-visible { outline: 3px solid #fda1ff; outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .pulse, .wobble { animation: none; }
  }
</style>
</head>
<body>
  <main class="wrap">

    <header>
      <!-- FOTO: coloque sua imagem como avatar.jpg na mesma pasta -->
      <div class="avatar"><img src="avatar.jpg" alt="Foto de perfil" onerror="this.remove()"></div>
      <h1>Gaby Bracinho</h1>
      <p class="bio">Aqui é onde a brincadeira começa...</p>
    </header>

    <nav class="links" aria-label="Meus links">

      <!-- BOTÃO 1 (com imagem à esquerda e efeito de balançar).
           Imagem: coloque como icone1.jpg na mesma pasta. Troque o href pelo seu link. -->
      <a class="btn wobble" href="https://paylume.fans/l/7063e398?shk=cm5a01kz" target="_blank" rel="noopener noreferrer">
        <span class="side"><img src="icone1.jpg" alt="" onerror="this.remove()"></span>
        <span class="txt">MEU CONTEÚDO AQUI 🥵</span>
        <span class="side" aria-hidden="true"></span>
      </a>

      <!-- BOTÃO 2 (sem imagem, com efeito de balançar). Troque o href pelo seu link. -->
      <a class="btn wobble sem-icone" href="https://pay.orionbot.space/p/gaby-bracynhoyy634" target="_blank" rel="noopener noreferrer">
        <span class="txt">MEU PRIVACY 🍊</span>
      </a>

      <!-- BOTÃO 3: bandeiras. Fica escondido e SEM link no HTML; o link vem de /api/destino e só para quem não está no Brasil (IP). O link se troca no arquivo api/destino.js -->
      <a class="btn wobble col" id="intl" hidden target="_blank" rel="noopener noreferrer" aria-label="International">
        <span class="bandeiras"><svg viewBox="0 0 36 24" role="img" aria-label="México"><rect width="12" height="24" fill="#006847"/><rect x="12" width="12" height="24" fill="#fff"/><rect x="24" width="12" height="24" fill="#ce1126"/><circle cx="18" cy="12" r="3" fill="#a0702f"/><circle cx="18" cy="12" r="1.6" fill="#4a8f3c"/></svg><svg viewBox="0 0 36 24" role="img" aria-label="Argentina"><rect width="36" height="24" fill="#74acdf"/><rect y="8" width="36" height="8" fill="#fff"/><circle cx="18" cy="12" r="2.4" fill="#f6b40e"/></svg><svg viewBox="0 0 36 24" role="img" aria-label="Estados Unidos"><rect width="36" height="24" fill="#fff"/><rect y="0.00" width="36" height="1.85" fill="#b22234"/><rect y="3.69" width="36" height="1.85" fill="#b22234"/><rect y="7.38" width="36" height="1.85" fill="#b22234"/><rect y="11.08" width="36" height="1.85" fill="#b22234"/><rect y="14.77" width="36" height="1.85" fill="#b22234"/><rect y="18.46" width="36" height="1.85" fill="#b22234"/><rect y="22.15" width="36" height="1.85" fill="#b22234"/><rect width="15.8" height="12.9" fill="#3c3b6e"/><circle cx="2.2" cy="1.9" r="0.65" fill="#fff"/><circle cx="5.6" cy="1.9" r="0.65" fill="#fff"/><circle cx="9.0" cy="1.9" r="0.65" fill="#fff"/><circle cx="12.4" cy="1.9" r="0.65" fill="#fff"/><circle cx="2.2" cy="5.1" r="0.65" fill="#fff"/><circle cx="5.6" cy="5.1" r="0.65" fill="#fff"/><circle cx="9.0" cy="5.1" r="0.65" fill="#fff"/><circle cx="12.4" cy="5.1" r="0.65" fill="#fff"/><circle cx="2.2" cy="8.3" r="0.65" fill="#fff"/><circle cx="5.6" cy="8.3" r="0.65" fill="#fff"/><circle cx="9.0" cy="8.3" r="0.65" fill="#fff"/><circle cx="12.4" cy="8.3" r="0.65" fill="#fff"/><circle cx="2.2" cy="11.5" r="0.65" fill="#fff"/><circle cx="5.6" cy="11.5" r="0.65" fill="#fff"/><circle cx="9.0" cy="11.5" r="0.65" fill="#fff"/><circle cx="12.4" cy="11.5" r="0.65" fill="#fff"/></svg><svg viewBox="0 0 36 24" role="img" aria-label="Venezuela"><rect width="36" height="8" fill="#ffcc00"/><rect y="8" width="36" height="8" fill="#00247d"/><rect y="16" width="36" height="8" fill="#cf142b"/><circle cx="11.66" cy="12.04" r="0.75" fill="#fff"/><circle cx="12.93" cy="10.18" r="0.75" fill="#fff"/><circle cx="14.73" cy="8.81" r="0.75" fill="#fff"/><circle cx="16.87" cy="8.09" r="0.75" fill="#fff"/><circle cx="19.13" cy="8.09" r="0.75" fill="#fff"/><circle cx="21.27" cy="8.81" r="0.75" fill="#fff"/><circle cx="23.07" cy="10.18" r="0.75" fill="#fff"/><circle cx="24.34" cy="12.04" r="0.75" fill="#fff"/></svg></span>
        <span class="txt">INTERNATIONAL</span>
      </a>

      <!-- Para adicionar mais botões, copie um bloco <a class="btn ..."> inteiro -->

    </nav>
  </main>

  <!-- TELA +18: aparece assim que a página é aberta -->
  <div class="idade" id="idade" role="dialog" aria-modal="true" aria-labelledby="idade-titulo">
    <div class="caixa">
      <div class="selo" aria-hidden="true">🔞</div>
      <h2 id="idade-titulo">Conteúdo para maiores de 18 anos</h2>
      <p>Esta página contém conteúdo adulto. Confirme que você tem 18 anos ou mais para continuar.</p>
      <button type="button" class="sim" id="idade-sim">Tenho 18 anos ou mais</button>
      <button type="button" class="nao" id="idade-nao">Sair</button>
    </div>
  </div>

  <script>
    /* FILTRO +18: aparece ao abrir a página. Ao confirmar, a página libera.
       Ao recarregar, a pergunta aparece de novo. */
    (function () {
      var idade = document.getElementById("idade");
      var principal = document.querySelector("main");
      var sim = document.getElementById("idade-sim");
      var nao = document.getElementById("idade-nao");
      principal.inert = true;
      sim.focus();
      sim.addEventListener("click", function () {
        idade.remove();
        principal.inert = false;
      });
      nao.addEventListener("click", function () { window.location.href = "https://www.google.com/"; });
    })();
  </script>

  <script>
    /* BOTÃO 3 (bandeiras): só aparece para quem NÃO está no Brasil, pelo IP.
       A decisão é feita no servidor (api/destino.js); o link não vai no HTML da página. */
    (function () {
      var botao = document.getElementById("intl");
      if (!botao) return;
      fetch("/api/destino", { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (d && d.ok && /^https?:\/\//.test(d.url)) {
            botao.href = d.url;
            botao.hidden = false;
          }
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
